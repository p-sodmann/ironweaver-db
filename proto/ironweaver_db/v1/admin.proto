// Ironweaver DB gRPC contract, version 1: the operator's reads and
// cancelling a request (step 16c, ADRs 0050 to 0052), and the admin writes
// (step 16e, ADR 0055): checkpoints, backups, verifying, pruning the WAL
// archive.
//
// One RPC per operation of the `Admin` trait (crates/iwdb-query), with the
// same semantics: the server only translates. Every list is bounded. Who
// may call what (ADR 0045): any authenticated caller reads the status, the
// metrics and the change-stream readers, narrowed to the namespaces it has
// a role on, and lists and cancels its own requests; a server-wide admin
// sees and cancels everyone's and reads the log. Cancelling is audited.
// The admin writes are a server-wide admin's, and every call is audited.
// They can't be cancelled, and have no deadline: a throttled backup runs
// as long as its copy takes.
//
// Nothing here holds a secret, a token, a certificate or a value of the
// data: names, numbers and the server's own log lines (which hold none).

syntax = "proto3";

package ironweaver_db.v1;

import "ironweaver_db/v1/catalog.proto";

service AdminService {
  // Version, uptime, readiness, fsync policy, memory, disk, request counts
  // and every namespace's status.
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
  // The running requests, oldest first.
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
  // Cancel a running request: its caller gets `cancelled`, unless its
  // answer was ready first. Commits and other changes can't be cancelled
  // (`invalid_argument`).
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  // The change-stream readers that polled in the last minute, with their
  // lag.
  rpc ListConsumers(ListConsumersRequest) returns (ListConsumersResponse);
  // Every metric (documentation/api/metrics.md); `GET /metrics` serves
  // them in Prometheus' text format.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  // The server's last log events (server-wide admin).
  rpc GetLog(GetLogRequest) returns (GetLogResponse);
  // Checkpoint a namespace, or every namespace: write a checkpoint at its
  // seq and remove what is no longer kept (archived first, if the store
  // archives its WAL). Waits for a running backup's copy.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  // Back up the store into the server's backup directory (`[backup] dir`),
  // under a new name; then verify the backup.
  rpc Backup(BackupRequest) returns (BackupResponse);
  // Verify the running store, a backup in the backup directory, or the
  // store's WAL archive, without changing it. Damage is in the report.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Remove from the store's WAL archive what no restore from a backup (in
  // the backup directory) or a later one can need.
  rpc PruneArchive(PruneArchiveRequest) returns (PruneArchiveResponse);
}

message GetServerStatusRequest {}

message GetServerStatusResponse {
  ServerStatus status = 1;
}

message ServerStatus {
  // The server's version.
  string version = 1;
  // When the database started serving, in microseconds since 1970 (UTC).
  int64 started_micros = 2;
  // Whether it serves requests: false once it drains (shutdown).
  bool ready = 3;
  // The WAL's fsync policy: `always`, `group` or `off`.
  string fsync = 4;
  MemoryStatus memory = 5;
  DiskStatus disk = 6;
  RequestCounts requests = 7;
  // The namespaces' status (those the caller has a role on), by name.
  repeated NamespaceStatus namespaces = 8;
}

// Memory as the server counts it, and its limit (ADR 0054). The limit
// counts `used_bytes`: the graphs, their payloads, the checkpointers' copies
// and the working memory.
message MemoryStatus {
  // The live graphs (the core's estimate), indexes included.
  uint64 graph_bytes = 1;
  // The memory limit; missing: none.
  optional uint64 limit_bytes = 2;
  // The live graphs' attribute payloads, estimated.
  uint64 payload_bytes = 3;
  // The checkpointers' copies of the namespaces, graphs and payloads.
  uint64 checkpoint_bytes = 4;
  // Analytics projections and index builds while they run, estimated.
  uint64 working_bytes = 5;
  // The sum of the parts: what the limit counts.
  uint64 used_bytes = 6;
  // From here on the server warns; missing without a limit.
  optional uint64 warn_bytes = 7;
  // From here on the server refuses writes (`resource_exhausted`); missing
  // without a limit.
  optional uint64 refuse_writes_bytes = 8;
  MemoryState state = 9;
  // Where the limit came from; unspecified without a limit.
  MemoryLimitSource limit_source = 10;
}

// The memory state. Each state is left only once memory is 5 % of the limit
// below its line.
enum MemoryState {
  MEMORY_STATE_UNSPECIFIED = 0;
  // Below the warning line, or no limit.
  MEMORY_STATE_NORMAL = 1;
  // At or above the warning line: writes are accepted.
  MEMORY_STATE_WARN = 2;
  // At or above the refusal line: writes that add are refused.
  MEMORY_STATE_REFUSING_WRITES = 3;
}

enum MemoryLimitSource {
  MEMORY_LIMIT_SOURCE_UNSPECIFIED = 0;
  // `[memory] limit_bytes`.
  MEMORY_LIMIT_SOURCE_CONFIG = 1;
  // The cgroup v2 `memory.max` of the server's process.
  MEMORY_LIMIT_SOURCE_CGROUP_V2 = 2;
  // The cgroup v1 `memory.limit_in_bytes` of the server's process.
  MEMORY_LIMIT_SOURCE_CGROUP_V1 = 3;
}

message DiskStatus {
  // The namespaces' WAL segments.
  uint64 wal_bytes = 1;
  // The namespaces' checkpoints.
  uint64 checkpoint_bytes = 2;
  // Free for the server on the data directory's file system; missing where
  // that can't be read.
  optional uint64 free_bytes = 3;
}

// Requests since the database started.
message RequestCounts {
  // Running now.
  uint64 active = 1;
  // Ended (refused ones included).
  uint64 total = 2;
  // Ended with `timeout`.
  uint64 timed_out = 3;
  // Ended with `cancelled` (by a cancel, or the client went away).
  uint64 cancelled = 4;
  // Refused with `unavailable` (the queue was full, or the server drained).
  uint64 rejected = 5;
  // Refused with `unauthenticated` or `permission_denied`.
  uint64 denied = 6;
}

message ListRequestsRequest {
  // Only this user's requests (a caller who isn't a server-wide admin sees
  // only its own anyway).
  optional string user = 1;
  // At most this many (default and maximum 1000).
  optional uint32 limit = 2;
}

message ListRequestsResponse {
  repeated RequestInfo requests = 1;
  // There were more than the limit.
  bool truncated = 2;
}

// A running request.
message RequestInfo {
  // Unique while the server runs (a counter from 1).
  uint64 id = 1;
  // Its operation: an RPC's name (`Find`, `GetChanges`, ...).
  string operation = 2;
  // The namespace it is on, if it is a namespace operation.
  optional string namespace = 3;
  // The caller's user.
  string user = 4;
  // The client's address.
  optional string client = 5;
  // When it started, in microseconds since 1970 (UTC).
  int64 started_micros = 6;
  // How long it has run.
  uint64 elapsed_micros = 7;
  // Whether CancelRequest can cancel it.
  bool cancellable = 8;
}

message CancelRequestRequest {
  uint64 id = 1;
  // Only if it is this user's (a caller who isn't a server-wide admin can
  // cancel only its own anyway); otherwise `not_found`.
  optional string user = 2;
}

message CancelRequestResponse {
  // The request, as it was when cancelled.
  RequestInfo request = 1;
}

message ListConsumersRequest {}

message ListConsumersResponse {
  // By namespace, user and client (at most 1024).
  repeated ConsumerInfo consumers = 1;
}

// A change-stream reader: a user, from a client, reading a namespace's
// changes, as of its last successful poll.
message ConsumerInfo {
  string namespace = 1;
  string user = 2;
  optional string client = 3;
  // The seq it reads from next.
  uint64 next_seq = 4;
  // Commits it hasn't read yet (of those the stream can return).
  uint64 lag = 5;
  // Its last successful poll, in microseconds since 1970 (UTC).
  int64 last_poll_micros = 6;
  // Successful polls so far.
  uint64 polls = 7;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  // Every metric, in the order of documentation/api/metrics.md.
  repeated MetricFamily families = 1;
}

// A metric and its samples.
message MetricFamily {
  string name = 1;
  MetricKind kind = 2;
  string help = 3;
  repeated MetricSample samples = 4;
}

enum MetricKind {
  METRIC_KIND_UNSPECIFIED = 0;
  METRIC_KIND_COUNTER = 1;
  METRIC_KIND_GAUGE = 2;
  METRIC_KIND_HISTOGRAM = 3;
}

// One series of a metric.
message MetricSample {
  // In the order of the metric's labels.
  repeated MetricLabel labels = 1;
  oneof value {
    uint64 counter = 2;
    double gauge = 3;
    MetricHistogram histogram = 4;
  }
}

message MetricLabel {
  string name = 1;
  string value = 2;
}

// Durations by bucket.
message MetricHistogram {
  // The buckets' upper bounds in seconds, without the last (+Inf).
  repeated double bounds_seconds = 1;
  // Observations per bucket (not cumulative): one more than the bounds,
  // the last for +Inf.
  repeated uint64 counts = 2;
  // The sum of the observations, in microseconds.
  uint64 sum_micros = 3;
}

message GetLogRequest {
  // The events after this one (0: from the oldest kept).
  uint64 after = 1;
  // At most this many (default and maximum 1000).
  optional uint32 limit = 2;
}

message GetLogResponse {
  // Oldest first.
  repeated LogEvent events = 1;
  // The last event logged so far: ask for the events after it next.
  uint64 last_seq = 2;
  // Events after `after` fell out of the ring before they were read, or
  // the limit cut the answer.
  bool missed = 3;
}

// An event of the server's log, as its JSON lines carry it.
message LogEvent {
  // Its number, from 1 (since the server started).
  uint64 seq = 1;
  // When it was logged, in microseconds since 1970 (UTC).
  int64 time_micros = 2;
  LogLevel level = 3;
  // Where it was logged: a module path, or `iwdb::audit`.
  string target = 4;
  string message = 5;
  // Its fields, in the order logged. Message and fields are cut at about
  // 2 KiB together.
  repeated LogField fields = 6;
}

message LogField {
  string name = 1;
  string value = 2;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE = 1;
  LOG_LEVEL_DEBUG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARN = 4;
  LOG_LEVEL_ERROR = 5;
}

message CheckpointRequest {
  // Only this namespace; missing: every namespace.
  optional string namespace = 1;
}

message CheckpointResponse {
  // By namespace.
  repeated NamespaceCheckpoint namespaces = 1;
}

message NamespaceCheckpoint {
  string namespace = 1;
  // The seq of the newest checkpoint after the run.
  uint64 seq = 2;
  // Whether a checkpoint was written (false: the newest was at the seq).
  bool written = 3;
  // The seqs of the checkpoints removed.
  repeated uint64 removed_checkpoints = 4;
  // The first seqs of the WAL segments removed.
  repeated uint64 removed_segments = 5;
}

message BackupRequest {
  // The backup's name in the backup directory: 1 to 128 ASCII letters,
  // digits, `.`, `_` or `-`, not starting with `.`. Nothing may exist under
  // it yet (`conflict`).
  string name = 1;
  // Copy at most this many bytes per second; missing: the server's
  // `[backup] max_bytes_per_second`; 0: unthrottled. Checkpoints wait for
  // the whole copy.
  optional uint64 max_bytes_per_second = 2;
  // Don't verify the backup once written.
  bool no_verify = 3;
}

message BackupResponse {
  BackupReport backup = 1;
  // The backup's verification (missing with `no_verify`).
  optional VerifyReport verify = 2;
}

message BackupReport {
  // Where the backup is, on the server.
  string path = 1;
  // The store's history id (32 hex digits).
  string history = 2;
  // By namespace id.
  repeated NamespaceBackup namespaces = 3;
  // Bytes copied.
  uint64 bytes = 4;
}

message NamespaceBackup {
  uint64 id = 1;
  string name = 2;
  // The seq the backup reaches in the namespace (its synced seq then).
  uint64 seq = 3;
  // That commit's time, in microseconds since 1970 (UTC), if known.
  optional int64 time_micros = 4;
  // The seqs of the checkpoints copied.
  repeated uint64 checkpoints = 5;
  // The first seqs of the WAL segments copied.
  repeated uint64 segments = 6;
}

message VerifyRequest {
  // A backup in the backup directory, by name.
  optional string backup = 1;
  // The store's WAL archive. With neither, the running store.
  bool archive = 2;
}

message VerifyResponse {
  VerifyReport report = 1;
}

// What verify checked and found (as `iwctl verify` reports it).
message VerifyReport {
  string path = 1;
  VerifyKind kind = 2;
  // The layout version of a data directory or backup, the format version
  // of an archive.
  optional uint32 version = 3;
  // The history id (32 hex digits).
  optional string history = 4;
  // Damage: empty if intact.
  repeated Finding problems = 5;
  // What a crash or an interrupted cleanup leaves, which recovery handles:
  // not damage.
  repeated Finding notes = 6;
  uint64 checkpoints = 7;
  uint64 checkpoints_checked = 8;
  uint64 segments = 9;
  uint64 records = 10;
  // With exactly one namespace: its first and last WAL record, the seq it
  // recovers to, and the last record's commit time (microseconds).
  optional uint64 first_seq = 11;
  optional uint64 last_seq = 12;
  optional uint64 seq = 13;
  optional int64 time_micros = 14;
  // By namespace id.
  repeated NamespaceVerify namespaces = 15;
}

enum VerifyKind {
  VERIFY_KIND_UNSPECIFIED = 0;
  VERIFY_KIND_DATA_DIR = 1;
  VERIFY_KIND_BACKUP = 2;
  VERIFY_KIND_ARCHIVE = 3;
}

message Finding {
  // The file it is about.
  optional string path = 1;
  string message = 2;
}

message NamespaceVerify {
  uint64 id = 1;
  string name = 2;
  uint64 checkpoints = 3;
  uint64 checkpoints_checked = 4;
  uint64 segments = 5;
  uint64 records = 6;
  optional uint64 first_seq = 7;
  optional uint64 last_seq = 8;
  optional uint64 seq = 9;
  optional int64 time_micros = 10;
}

message PruneArchiveRequest {
  // The oldest backup to keep, by name in the backup directory.
  string before = 1;
  // Remove nothing: report what would be removed.
  bool dry_run = 2;
}

message PruneArchiveResponse {
  PruneReport report = 1;
}

message PruneReport {
  string archive = 1;
  string backup = 2;
  bool dry_run = 3;
  // The namespaces the backup holds, by id.
  repeated NamespacePrune namespaces = 4;
  // Namespaces of the archive the backup doesn't hold: left alone.
  repeated uint64 untouched = 5;
  // Bytes removed (or that would be).
  uint64 bytes = 6;
}

message NamespacePrune {
  uint64 id = 1;
  string name = 2;
  // The namespace's oldest checkpoint in the backup (0: none, and nothing
  // is removed). Every archived record after it is kept.
  uint64 backup_checkpoint = 3;
  // The first seqs of the segments removed.
  repeated uint64 removed_segments = 4;
  // The seqs of the archived (imports') checkpoints removed.
  repeated uint64 removed_checkpoints = 5;
  uint64 kept_segments = 6;
}
