name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Cargo's build.warnings (Rust 1.97): a warning from rustc or clippy
      # fails every step below, without changing the compiler flags (and so
      # the cache key) the way RUSTFLAGS=-Dwarnings would
      CARGO_BUILD_WARNINGS: deny
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain named in rust-toolchain.toml (stable, rustfmt, clippy)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start PGlite for the Postgres tests (step 13, ADR 0032)
        # Postgres in WebAssembly over the wire protocol: no service
        # container, the same on Linux and macOS
        run: |
          scripts/pglite.sh > "$RUNNER_TEMP/pglite.log" 2>&1 &
          for i in $(seq 1 120); do grep -q listening "$RUNNER_TEMP/pglite.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/pglite.log"
          grep -q listening "$RUNNER_TEMP/pglite.log"
          echo "IWDB_TEST_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - name: No Python in the dependency graph
        # Design rule 1: pyo3 only in crates/iwdb-python, which is in the
        # workspace since step 7; every other crate must stay free of it
        run: |
          if cargo tree -p iwdb-engine -p iwdb-storage -p iwdb -p iwctl -p iwdb-crash -p iwdb-server -e normal | grep -q pyo3; then
            echo "pyo3 must not be a dependency of the engine, storage, store, server or CLI crates" >&2
            exit 1
          fi

  features:
    # Step 13a (ADR 0034): iwdb-server without its default features (gRPC
    # only, no Postgres source) and with each one alone; the jobs above
    # cover all features together
    name: iwdb-server feature sets
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    strategy:
      fail-fast: false
      matrix:
        features: ["", "rest", "postgres"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.features }}
      - run: cargo clippy -p iwdb-server --all-targets --locked --no-default-features --features "${{ matrix.features }}"
      - run: cargo test -p iwdb-server --locked --no-default-features --features "${{ matrix.features }}"
      - name: No Postgres or REST crates in a gRPC-only build
        if: matrix.features == ''
        run: |
          if cargo tree -p iwdb-server --no-default-features -e normal | grep -E ' (postgres|pbjson|axum|prost-types) '; then
            echo "a gRPC-only iwdb-server must not depend on these crates" >&2
            exit 1
          fi

  docker:
    # Step 13a: the image builds, with and without the default features,
    # serves, and shuts down cleanly on docker stop
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (default features)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iwdb-server:ci
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
      - name: Build (gRPC only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iwdb-server:ci-grpc
          build-args: FEATURES=
          cache-from: type=gha,scope=docker-grpc
          cache-to: type=gha,mode=max,scope=docker-grpc
      - name: Serve, answer, stop
        run: |
          docker run --rm iwdb-server:ci --version | tee version.txt
          grep -q "grpc, rest, postgres" version.txt
          docker run --rm iwdb-server:ci-grpc --version | tee version.txt
          grep -q "(grpc)" version.txt
          docker run -d --name iwdb -p 127.0.0.1:7600:7600 iwdb-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7600/v1/openapi.json -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:7600/v1/namespaces | tee namespaces.json
          grep -q default namespaces.json
          docker stop iwdb
          docker logs iwdb 2>&1 | tee server.log
          test "$(docker inspect -f '{{.State.ExitCode}}' iwdb)" = 0
          grep -q "closed /var/lib/iwdb" server.log

  python:
    # Step 7: the wheel (abi3, CPython 3.9 and later) built by maturin on
    # every platform we ship, and the Python tests run against it on the
    # oldest and the newest Python. Windows isn't shipped yet (ADR 0013).
    # Step 14: the tests that use the `store` fixture run a second time
    # against a gRPC-only iwdb-server (ADR 0035); IWDB_REQUIRE_REMOTE makes
    # a missing server a failure, not a skip.
    name: wheel and pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path crates/iwdb-python/Cargo.toml
          manylinux: auto
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server for the remote half of the suite
        run: cargo build --locked --release -p iwdb-server --no-default-features
      - run: python -m pip install dist/*.whl pytest hypothesis
      - run: python -m pytest crates/iwdb-python/tests -q
        env:
          IWDB_SERVER: target/release/iwdb-server
          IWDB_REQUIRE_REMOTE: "1"

  crash:
    # Step 6: kill -9 at random points and failpoints, check recovery. The
    # seed is printed; a failure prints the command that reruns it. The
    # nightly workflow runs thousands of cycles.
    name: crash harness, short (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p iwdb-crash
      - name: 150 kill/recover cycles per fsync policy
        run: ./target/release/iwdb-crash --policy all --cycles 150 --seed "${{ github.run_id }}${{ github.run_attempt }}" --work "$RUNNER_TEMP/iwdb-crash"
      - name: Keep the files of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.os }}
          path: ${{ runner.temp }}/iwdb-crash
          if-no-files-found: ignore

  msrv:
    name: Rust 1.99 (MSRV)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml; keep in step with rust-version in Cargo.toml (ADR 0029)
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  deny:
    name: cargo deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  buf:
    # Step 11: the gRPC contract (proto/ironweaver_db/v1). Lint on every push;
    # check for breaking changes against what the base had: the pull
    # request's base, main for pushes to other branches, the previous head
    # for pushes to main. A base without the protos has nothing to break.
    name: buf lint and breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$REF" = "refs/heads/main" ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse origin/main)"
          fi
          if [ -n "$base" ] && git cat-file -e "$base:proto/ironweaver_db/v1" 2>/dev/null; then
            buf breaking --against ".git#ref=$base"
          else
            echo "the base ($base) has no v1 protos: nothing to break"
          fi

  openapi:
    # Step 12: the REST API's OpenAPI document. The cargo tests keep
    # documentation/api/openapi.json equal to the document the server
    # generates and serves; this validates it against OpenAPI 3.1
    # (redocly.yaml: the recommended rules).
    name: OpenAPI document (redocly lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2.57.0 lint documentation/api/openapi.json

  fuzz:
    name: fuzz the WAL reader (nightly, 60 s)
    runs-on: ubuntu-latest
    env:
      # fuzz/ is a nightly-only workspace; overrides rust-toolchain.toml
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run wal_reader -- -max_total_time=60 -malloc_limit_mb=256 -max_len=4096
