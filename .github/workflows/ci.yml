name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain named in rust-toolchain.toml (stable, rustfmt, clippy)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: No Python in the dependency graph
        run: |
          if cargo tree --workspace -e normal | grep -q pyo3; then
            echo "pyo3 must not be a dependency of the engine crates" >&2
            exit 1
          fi

  crash:
    # Step 6: kill -9 at random points and failpoints, check recovery. The
    # seed is printed; a failure prints the command that reruns it. The
    # nightly workflow runs thousands of cycles.
    name: crash harness, short (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p iwdb-crash
      - name: 150 kill/recover cycles per fsync policy
        run: ./target/release/iwdb-crash --policy all --cycles 150 --seed "${{ github.run_id }}${{ github.run_attempt }}" --work "$RUNNER_TEMP/iwdb-crash"
      - name: Keep the files of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.os }}
          path: ${{ runner.temp }}/iwdb-crash
          if-no-files-found: ignore

  msrv:
    name: Rust 1.85 (MSRV)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml; keep in step with rust-version in Cargo.toml
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    name: fuzz the WAL reader (nightly, 60 s)
    runs-on: ubuntu-latest
    env:
      # fuzz/ is a nightly-only workspace; overrides rust-toolchain.toml
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run wal_reader -- -max_total_time=60 -malloc_limit_mb=256 -max_len=4096
