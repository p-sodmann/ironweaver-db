[package]
name = "iwctl"
description = "Ironweaver DB admin CLI: status, checkpoint, backup, restore and verify for local data directories, and a query shell for servers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "iwctl"
path = "src/main.rs"

[dependencies]
iwdb = { path = "../iwdb" }
iwdb-storage = { path = "../iwdb-storage" }
# The query shell (step 14a): the core's filters and patterns, the
# Database trait, and the gRPC client (ADR 0024) without REST or Postgres
ironweaver-core.workspace = true
iwdb-query = { path = "../iwdb-query" }
iwdb-server = { path = "../iwdb-server", default-features = false, features = ["client"] }
# --json output (already in the tree)
serde_json.workspace = true

# A password from the console without echo on Windows (ADR 0058), where
# there is no `stty`; well known, on windows-sys (already in the tree)
[target.'cfg(windows)'.dependencies]
rpassword = "7.5"

[dev-dependencies]
tempfile.workspace = true
# The shell's tests serve a store in-process (iwdb_server::Server)
tokio.workspace = true

[lints]
workspace = true
