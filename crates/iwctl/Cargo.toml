[package]
name = "iwctl"
description = "Ironweaver DB admin CLI: status, checkpoint, backup, restore and verify for local data directories"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "iwctl"
path = "src/main.rs"

[dependencies]
iwdb = { path = "../iwdb" }
iwdb-storage = { path = "../iwdb-storage" }
# --json output (already in the tree)
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
