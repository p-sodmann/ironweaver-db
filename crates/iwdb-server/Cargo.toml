[package]
name = "iwdb-server"
description = "Ironweaver DB server: the Database trait over gRPC (tonic) and REST/JSON (axum), and Rust clients"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# gRPC is always there; REST and the Postgres source of projections can be
# left out (ADR 0034): `--no-default-features` builds a gRPC-only server
default = ["rest", "postgres"]
# The REST/JSON API (ADR 0030) on the gRPC port, with its OpenAPI document
rest = ["dep:axum", "dep:pbjson", "dep:pbjson-build", "dep:prost-types", "dep:serde_json", "dep:http-body-util"]
# `[[projection]]` sources of kind "postgres" (ADR 0032)
postgres = ["iwdb/postgres"]
# The operator console's pages (ADR 0041), compiled in from `console/` and
# served at /console/ when `[console] enabled = true`; it uses the REST API
console = ["rest"]
# OpenTelemetry traces over OTLP (step 16g, ADR 0057), configured in
# `[tracing]`; it uses the clients' HTTP and TLS stack to reach the collector
otel = ["client", "dep:http-body-util", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-proto", "dep:tracing-opentelemetry"]
# The Rust clients (`client::Remote` over gRPC, ADR 0024; with `rest`,
# `client::RestRemote` over REST, ADR 0030); the tests turn it on
client = ["hyper/client", "hyper/http1", "hyper-util/client-legacy", "hyper-util/http1", "tonic/tls-ring", "tonic/tls-native-roots", "dep:rustls-native-certs"]

[[bin]]
name = "iwdb-server"
path = "src/main.rs"

[dependencies]
ironweaver-core.workspace = true
iwdb-engine = { path = "../iwdb-engine" }
iwdb-storage = { path = "../iwdb-storage" }
iwdb-query = { path = "../iwdb-query" }
# The binary serves an embedded store (`Embedded`) and closes it on shutdown;
# its projections read Postgres tables with the `postgres` feature (step 13)
iwdb = { path = "../iwdb" }
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
# One port for both APIs: HTTP/2 (gRPC, REST) and HTTP/1.1 (REST)
hyper = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["http1", "server-auto"] }
# REST only (feature `rest`)
axum = { workspace = true, optional = true }
pbjson = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
http.workspace = true
bytes.workspace = true
tower-service.workspace = true
# Values, filters and patterns on the wire: the core's serde in postcard (ADR 0023)
postcard.workspace = true
serde.workspace = true
# REST bodies; `raw_value` lets a value or filter be read by the core's own
# JSON reader (ADR 0030), `float_roundtrip` reads every float exactly
serde_json = { workspace = true, optional = true, features = ["raw_value", "float_roundtrip"] }
toml.workspace = true
thiserror.workspace = true
log.workspace = true
# TLS and mTLS on the one port (step 15b, ADR 0048); the probe's TLS too
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
# The clients' trust store when no CA is given (feature `client`)
rustls-native-certs = { workspace = true, optional = true }
# Health: grpc.health.v1's generated messages and service (step 16b; the
# implementation is ours, over the server's phase); structured logs
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Traces over OTLP (feature `otel`, ADR 0057)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true
pbjson-build = { workspace = true, optional = true }
prost.workspace = true

[dev-dependencies]
# Without the default features, so `--no-default-features` tests a gRPC-only server
iwdb-server = { path = ".", default-features = false, features = ["client"] }
iwdb-query = { path = "../iwdb-query", features = ["conformance"] }
iwdb-storage = { path = "../iwdb-storage", features = ["failpoints"] }
iwdb-engine = { path = "../iwdb-engine", features = ["testutil"] }
tempfile.workspace = true
# A raw HTTP/2 client for the tests that send headers tonic's channel would
# act on itself (grpc-timeout) or bytes `Remote` refuses to send
hyper-util = { workspace = true, features = ["client-legacy", "http2"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
# Fills the table a projection reads, in PGlite (step 13)
postgres.workspace = true
# Benchmarks (step 14b)
criterion.workspace = true
# Traces (step 16g): the SDK's in-memory exporter for the span tree tests
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[[bench]]
name = "graph"
harness = false

[lints]
workspace = true
