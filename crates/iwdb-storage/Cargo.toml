[package]
name = "iwdb-storage"
description = "Ironweaver DB storage: write-ahead log, data directory, checkpoints and recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
crc32c.workspace = true
ironweaver-core.workspace = true
iwdb-engine = { path = "../iwdb-engine" }
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# `failpoint::FailFs`: failpoints on every write-side file operation, for
# tests and the crash harness (step 6). Normal builds don't have them.
failpoints = []

[dev-dependencies]
iwdb-engine = { path = "../iwdb-engine", features = ["testutil"] }
# Our own tests inject faults through `failpoint::FailFs`
iwdb-storage = { path = ".", features = ["failpoints"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
