[package]
name = "iwdb-engine"
description = "Ironweaver DB engine: payload, catalog and commit pipeline on top of ironweaver-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ironweaver-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Fingerprints of requests made with an idempotency key (step 8): CRC32C
# of their postcard encoding; both are in the tree already (iwdb-storage)
crc32c.workspace = true
postcard.workspace = true
# Only with `testutil`: the random workload strategies
proptest = { workspace = true, optional = true }

[features]
# Test helpers for other crates' tests and the crash harness: the random
# workload strategies in `testutil::workload`. Never needed at run time.
testutil = ["dep:proptest"]
# `failpoint::fail_next_apply`: make an apply fail as the core does on a bug
# (ADR 0028). Tests only.
failpoints = []

[dev-dependencies]
# Our own tests use the workload strategies
iwdb-engine = { path = ".", features = ["testutil"] }
proptest.workspace = true

[lints]
workspace = true
