[package]
name = "iwdb"
description = "Ironweaver DB embedded: a durable graph store in a directory (Store::open)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ironweaver-core.workspace = true
iwdb-engine = { path = "../iwdb-engine" }
iwdb-storage = { path = "../iwdb-storage" }
log.workspace = true

[dev-dependencies]
iwdb-storage = { path = "../iwdb-storage", features = ["failpoints"] }
iwdb-engine = { path = "../iwdb-engine", features = ["testutil"] }
proptest.workspace = true
tempfile.workspace = true
crc32c.workspace = true

[lints]
workspace = true
