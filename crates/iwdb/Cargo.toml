[package]
name = "iwdb"
description = "Ironweaver DB embedded: a durable graph store in a directory (Store::open)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ironweaver-core.workspace = true
iwdb-engine = { path = "../iwdb-engine" }
iwdb-storage = { path = "../iwdb-storage" }
# The Database trait this crate implements (`Embedded`), and the types it shares
iwdb-query = { path = "../iwdb-query" }
log.workspace = true

[dev-dependencies]
iwdb-query = { path = "../iwdb-query", features = ["conformance"] }
iwdb-storage = { path = "../iwdb-storage", features = ["failpoints"] }
iwdb-engine = { path = "../iwdb-engine", features = ["testutil"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
