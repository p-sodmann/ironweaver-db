[package]
name = "iwdb"
description = "Ironweaver DB embedded: a durable graph store in a directory (Store::open)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ironweaver-core.workspace = true
iwdb-engine = { path = "../iwdb-engine" }
iwdb-storage = { path = "../iwdb-storage" }
# The Database trait this crate implements (`Embedded`), and the types it shares
iwdb-query = { path = "../iwdb-query" }
log.workspace = true
# Trace spans (step 16g, ADR 0057): target `iwdb::trace`, free without a subscriber
tracing.workspace = true
# Projection errors (step 13) and the declarative mapping's config (`projection::Rules`)
thiserror.workspace = true
serde.workspace = true
# Users and tokens (step 15a, ADR 0044). Declared here, not in the workspace,
# so the workspace manifest stays as it is:
# argon2id password hashes from RustCrypto; the PHC string records its parameters
argon2 = "0.6"
# SHA-256 of session and API tokens, from RustCrypto (already in the tree)
sha2 = "0.11"
# Token secrets and salts from the OS's random source (already in the tree)
getrandom = "0.4"
# The Postgres source of projection mode (step 13, feature `postgres`): the sync
# client (tokio-postgres inside, on its own runtime); `jsonb` columns as JSON
postgres = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# The data directory's free space for the status views (step 16c), from
# `statvfs` without unsafe code (already in the tree, through tempfile)
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[features]
# `projection::postgres::PostgresSource` (ADR 0032)
postgres = ["dep:postgres", "dep:serde_json"]

[dev-dependencies]
iwdb-query = { path = "../iwdb-query", features = ["conformance"] }
iwdb-storage = { path = "../iwdb-storage", features = ["failpoints"] }
iwdb-engine = { path = "../iwdb-engine", features = ["testutil", "failpoints"] }
proptest.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
