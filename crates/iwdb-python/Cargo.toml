[package]
name = "iwdb-python"
description = "Ironweaver DB for Python: PyO3 bindings of the embedded store and the gRPC client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "iwdb_python"
crate-type = ["cdylib"]
# Most bindings are tested with pytest against the built module. The focused
# error adapter integration test links libpython (CI provisions Python explicitly).
test = false
doctest = false

[dependencies]
ironweaver-core.workspace = true
iwdb = { path = "../iwdb" }
# The Database trait the bindings call (through iwdb::Embedded)
iwdb-query = { path = "../iwdb-query" }
iwdb-engine = { path = "../iwdb-engine" }
iwdb-storage = { path = "../iwdb-storage" }
# The remote client (ADR 0035): `iwdb.connect` serves a Store from
# `client::Remote` over gRPC; no REST or Postgres parts
iwdb-server = { path = "../iwdb-server", default-features = false, features = ["client"] }
# The bindings (design rule 1: only in this crate). abi3: one wheel per
# platform for CPython 3.9 and later (ADR 0013); maturin adds the
# extension-module feature when it builds the wheel
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[lints]
workspace = true
