# The image's config of iwdb-server (all settings: the iwdb_server::config
# docs, documentation/api/grpc.md). Replace it by mounting your own file at
# /etc/iwdb/iwdb.toml.
#
# The server listens on every interface of the container. It has no TLS until
# step 15b, so that needs [server] plaintext_public = true, which this file
# leaves to you: run with -e IWDB_SERVER_PLAINTEXT_PUBLIC=true and publish
# the port on localhost or a private network only. Authentication is on: the
# first start needs IWDB_AUTH_BOOTSTRAP_PASSWORD (the user admin), or a user
# made with `iwctl user create` (step 15a).

data_dir = "/var/lib/iwdb"
listen = "0.0.0.0:7600"

[store]
fsync = "always"

[server]
# Below docker stop's default 10 s, so that a stop ends with a checkpoint
drain_timeout_secs = 8
