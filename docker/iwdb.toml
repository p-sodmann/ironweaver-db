# The image's config of iwdb-server (all settings: the iwdb_server::config
# docs, documentation/api/grpc.md). Replace it by mounting your own file at
# /etc/iwdb/iwdb.toml.
#
# No TLS and no authentication until step 15: the server listens on every
# interface of the container, so publish the port on localhost or a private
# network only.

data_dir = "/var/lib/iwdb"
listen = "0.0.0.0:7600"

[store]
fsync = "always"

[server]
# Below docker stop's default 10 s, so that a stop ends with a checkpoint
drain_timeout_secs = 8
