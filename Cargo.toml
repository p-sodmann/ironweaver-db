[workspace]
resolver = "2"
members = ["crates/iwdb-engine", "crates/iwdb-storage", "crates/iwdb", "crates/iwctl", "crates/iwdb-python", "tests/crash"]
# The cargo-fuzz targets need nightly and are a workspace of their own
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/p-sodmann/ironweaver-db"

[workspace.dependencies]
# Pinned git revision until 0.2.0 is on crates.io; see documentation/adr/0002-ironweaver-core-dependency.md.
ironweaver-core = { git = "https://github.com/p-sodmann/Ironweaver", rev = "3b15149b199603cf65c614efc843ef2d1342e205" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
proptest = "1"
criterion = "0.8"
# The WAL's record encoding (step 4); the core's `Op` and `Value` round-trip through it
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The catalog's encoding in graph meta (ADR 0003); also used by tests
serde_json = "1"
# CRC32C of WAL records, hardware accelerated (SSE 4.2, ARMv8 CRC)
crc32c = "0.6"
tempfile = "3"
# The data directory's exclusive lock (flock / LockFileEx); std's File::try_lock needs Rust 1.89, our MSRV is 1.85
# Warnings from recovery and the background threads of the embedded store (already in the tree)
log = "0.4"
fs4 = { version = "1", default-features = false, features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
