[workspace]
resolver = "2"
members = ["crates/iwdb-engine", "crates/iwdb-storage"]
# The cargo-fuzz targets need nightly and are a workspace of their own
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/p-sodmann/ironweaver-db"

[workspace.dependencies]
# Pinned git revision until 0.2.0 is on crates.io; see documentation/adr/0002-ironweaver-core-dependency.md.
ironweaver-core = { git = "https://github.com/p-sodmann/Ironweaver", rev = "a14149ee994e61a24b9996206c53b109b3a6072c" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
proptest = "1"
criterion = "0.8"
# The WAL's record encoding (step 4); the core's `Op` and `Value` round-trip through it
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The catalog's encoding in graph meta (ADR 0003); also used by tests
serde_json = "1"
# CRC32C of WAL records, hardware accelerated (SSE 4.2, ARMv8 CRC)
crc32c = "0.6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
