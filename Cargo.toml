[workspace]
resolver = "3"
members = ["crates/iwdb-engine", "crates/iwdb-storage", "crates/iwdb-query", "crates/iwdb", "crates/iwctl", "crates/iwdb-python", "crates/iwdb-server", "tests/crash"]
# The cargo-fuzz targets need nightly and are a workspace of their own
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"
repository = "https://github.com/p-sodmann/ironweaver-db"

[workspace.dependencies]
# Pinned git revision until 0.2.0 is on crates.io; see documentation/adr/0002-ironweaver-core-dependency.md.
ironweaver-core = { git = "https://github.com/p-sodmann/Ironweaver", rev = "9cec233619dbb34263f02c3275cec2beb207c732" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
proptest = "1"
criterion = "0.8"
# The WAL's record encoding (step 4); the core's `Op` and `Value` round-trip through it
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The catalog's encoding in graph meta (ADR 0003); also used by tests
serde_json = "1"
# CRC32C of WAL records, hardware accelerated (SSE 4.2, ARMv8 CRC)
crc32c = "0.6"
tempfile = "3"
# Warnings from recovery and the background threads of the embedded store (already in the tree)
log = "0.4"
# The gRPC server and client (step 11, iwdb-server only): tonic and prost, the
# Rust gRPC stack; the clients add TLS (`tls-ring`) through iwdb-server's `client` feature
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
# The server's async runtime (ADR 0020: no library crate but iwdb-server has one)
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros"] }
# The server's accept loop (iwdb_server::serve): tonic's routes on hyper connections we
# own, without tonic's grpc-timeout layer (ADR 0026); both already in the tree through tonic
hyper = { version = "1", default-features = false, features = ["server", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "http2", "server-graceful", "service"] }
# TLS (step 15b, ADR 0048): rustls with the ring provider (no cmake or nasm in
# the build, unlike aws-lc-rs), tokio-rustls for the accept loop (both also what
# tonic's `tls-ring` uses), and pki-types' PEM reader for certificates and keys
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
# The clients' trust store when no CA is given: the operating system's (also tonic's `tls-native-roots`)
rustls-native-certs = "0.8"
# The standard gRPC health service grpc.health.v1 (step 16b): Kubernetes'
# gRPC probes and grpc_health_probe speak it; from the tonic project
tonic-health = { version = "0.14", default-features = false }
# Structured logs (step 16b): tracing is already in the tree through tokio;
# tracing-subscriber writes JSON or text lines, filters them, and bridges the
# `log` records of the library crates. Spans (step 16g, ADR 0057): the storage,
# query and store crates open trace spans with the facade alone (no proc macros)
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi", "tracing-log"] }
# OpenTelemetry traces (step 16g, ADR 0057; iwdb-server feature `otel` only),
# all from the OpenTelemetry project, Apache-2.0, without default features:
# the API (spans, context, propagation)
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
# the SDK: the tracer provider, the parent-based ratio sampler and the W3C propagator
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
# OTLP's messages, the SDK's spans converted to them, and the gRPC client (on our tonic)
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
# tracing's spans as OpenTelemetry spans, so the library crates need only `tracing`
tracing-opentelemetry = { version = "0.34", default-features = false }
# Streamed answers as a stream of chunks (already in the tree through tonic)
tokio-stream = { version = "0.1", default-features = false }
# The server's config file
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
# Build: generated code from the protos, compiled by protox (pure Rust: no protoc)
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
protox = "0.9"
# REST (step 12, iwdb-server only): axum routes the JSON API next to tonic
# (axum is tonic's own router); pbjson generates the proto3 JSON serde of
# the messages, so REST and gRPC share one schema (ADR 0030)
axum = { version = "0.8", default-features = false, features = ["query"] }
pbjson = "0.9"
pbjson-build = "0.9"
# The descriptor set, decoded to generate the OpenAPI document (already in
# the tree through protox)
prost-types = "0.14"
# Request bodies with a size limit, and streamed answers (already in the
# tree through hyper and tonic)
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
# Projection mode's Postgres source (step 13, iwdb feature `postgres`): the
# sync client of rust-postgres, with `jsonb` as serde_json values; no TLS
# until step 15
postgres = { version = "0.19", default-features = false, features = ["with-serde_json-1"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
